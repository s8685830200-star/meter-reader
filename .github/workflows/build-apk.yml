name: Build Android APK

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Install Android SDK with explicit platform 35
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - run: npm run build
      - run: npx cap sync android

      - name: Ensure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "==> 注入缺失的权限声明"
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n</manifest>|' "$MANIFEST"
          fi

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release' || github.event_name == 'push'
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/release.keystore
          cd android && chmod +x gradlew && ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: meter-reader-apk
          path: android/app/build/outputs/apk/**/*.apk
