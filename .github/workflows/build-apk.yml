name: Build Android APK

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="${HOME}/android-sdk"
          echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV

          # Download cmdline-tools
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qo commandlinetools-linux-11076708_latest.zip -d "${SDK_ROOT}/cmdline-tools"
          mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          rm commandlinetools-linux-11076708_latest.zip

          # Accept licenses & install SDK 35
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

          # Create local.properties
          echo "sdk.dir=${SDK_ROOT}" > android/local.properties
          echo "SDK setup done. Installed platforms:"
          ls "${SDK_ROOT}/platforms/"

      - run: npx vite build
      - run: npx cap sync android

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release' || github.event_name == 'push'
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/release.keystore
          cd android && chmod +x gradlew && ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: meter-reader-apk
          path: android/app/build/outputs/apk/**/*.apk
