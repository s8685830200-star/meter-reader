name: Build Android APK

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm run build
      # android/ 目录已在仓库中，不需要 cap add，直接同步前端资源即可
      - run: npx cap sync android

      # 确保 AndroidManifest.xml 包含所有必需的权限声明
      # （仓库中的 AndroidManifest.xml 已有这些声明，此步骤为幂等补齐）
      - name: Ensure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 检查是否已有 CAMERA 权限，没有则注入
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "==> 注入缺失的权限声明"
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n</manifest>|' "$MANIFEST"
          else
            echo "==> 权限声明已存在，跳过注入"
          fi
          echo "=== AndroidManifest permissions ==="
          grep -E "uses-permission|uses-feature|queries" "$MANIFEST" || true

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release' || github.event_name == 'push'
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/release.keystore
          cd android && chmod +x gradlew && ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: meter-reader-apk
          path: android/app/build/outputs/apk/**/*.apk
